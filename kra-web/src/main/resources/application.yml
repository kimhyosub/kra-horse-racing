server:
  port: 8090
  # Cloudflare Tunnel 뒤에서 https 주소로 리다이렉트하도록
  forward-headers-strategy: framework

spring:
  datasource:
    # 파일 DB. 어디서 실행해도 같은 파일을 쓰도록 고정 경로 (C:/kra-data/db/gachima.mv.db)
    url: jdbc:h2:file:${GACHIMA_DB:C:/kra-data/db/gachima};AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      # H2 2.x 예약어와 겹치는 이름이 있어도 테이블이 만들어지도록 이름을 따옴표로 감싼다
      hibernate.globally_quoted_identifiers: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

gachima:
  # export_web.py 가 day-YYYYMMDD.json 을 쓰는 폴더
  import-dir: ${GACHIMA_IMPORT_DIR:C:/kra-data/web}
  # 폴더를 1분마다 보고 새로 생기거나 바뀐 파일만 불러온다
  auto-import: ${GACHIMA_AUTO_IMPORT:true}
  scan-ms: 60000

  # 로그인 (밖에서 공개 주소로 접속). 비밀번호를 비우면 실행할 때마다 임시 비밀번호를 콘솔에 보여준다
  login:
    user: ${GACHIMA_LOGIN_USER:admin}
    password: ${GACHIMA_LOGIN_PASSWORD:}
    public-read: ${GACHIMA_PUBLIC_READ:false}
    # 추가 사용자(입력 가능, 관리 불가) "아이디 = 비밀번호" 파일. 예시: automation/gachima-users.example.properties
    users-file: ${GACHIMA_USERS_FILE:C:/kra-data/gachima-users.properties}
  # 스크린샷 읽기 (Claude API). 키가 없으면 꺼진다
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${GACHIMA_CLAUDE_MODEL:claude-sonnet-5-5}
