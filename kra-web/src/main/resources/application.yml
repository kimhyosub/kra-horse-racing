server:
  port: 8090
  # Cloudflare Tunnel 뒤에서 https 주소로 리다이렉트하도록
  forward-headers-strategy: framework

spring:
  datasource:
    # 파일 DB. 어디서 실행해도 같은 파일을 쓰도록 고정 경로 (C:/kra-data/db/gachima.mv.db)
    url: jdbc:h2:file:${GACHIMA_DB:C:/kra-data/db/gachima};AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      # H2 2.x 예약어와 겹치는 이름이 있어도 테이블이 만들어지도록 이름을 따옴표로 감싼다
      hibernate.globally_quoted_identifiers: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

gachima:
  # export_web.py 가 day-YYYYMMDD.json 을 쓰는 폴더
  import-dir: ${GACHIMA_IMPORT_DIR:C:/kra-data/web}
  # 가이드 글 이미지 올리는 폴더 (/uploads/… 로 보임)
  upload-dir: ${GACHIMA_UPLOAD_DIR:C:/kra-data/uploads}
  # 폴더를 1분마다 보고 새로 생기거나 바뀐 파일만 불러온다
  auto-import: ${GACHIMA_AUTO_IMPORT:true}
  scan-ms: 60000

  # 로그인 (밖에서 공개 주소로 접속). 비밀번호를 비우면 실행할 때마다 임시 비밀번호를 콘솔에 보여준다
  login:
    user: ${GACHIMA_LOGIN_USER:admin}
    password: ${GACHIMA_LOGIN_PASSWORD:}
    public-read: ${GACHIMA_PUBLIC_READ:true}
    # 추가 사용자(입력 가능, 관리 불가) "아이디 = 비밀번호" 파일. 예시: automation/gachima-users.example.properties
    users-file: ${GACHIMA_USERS_FILE:C:/kra-data/gachima-users.properties}
  # 스크린샷 읽기 (Claude API). 키가 없으면 꺼진다
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${GACHIMA_CLAUDE_MODEL:claude-sonnet-5-5}
  # 텔레그램 봇: 스크린샷을 보내면 경주를 찾아 저장하고 당일 분석 1·2·3위와 ★ 를 답장. 웹 저장도 알림
  telegram:
    token: ${TELEGRAM_BOT_TOKEN:}
    # 허용(=알림 받을) 대화 ID, 쉼표로. 봇에게 /id 를 보내면 알려 줌
    chats: ${GACHIMA_TELEGRAM_CHATS:}
    # 공개 채널 (@채널이름 또는 -100… ID). 봇을 채널 관리자로 넣으면 출발 전 분석·결과·하루 결산을 자동으로 올림
    channel: ${GACHIMA_TELEGRAM_CHANNEL:}
  # 알림 속 링크 주소
  public-url: ${GACHIMA_PUBLIC_URL:https://gachima.co.kr}
  ads:
    # 애드센스 게시자 ID (예: ca-pub-1234567890123456). 넣으면 모든 공개 화면에 애드센스 코드·확인 메타태그, /ads.txt 가 생김
    client: ${GACHIMA_ADSENSE_CLIENT:}
    # 구글 서치 콘솔 'HTML 태그' 확인 코드 (content="…" 안의 값만)
    gsc-verify: ${GACHIMA_GSC_VERIFY:}
    # 네이버 서치어드바이저 'HTML 태그' 확인 코드 (<meta name="naver-site-verification" content="…"> 의 content 값만)
    naver-verify: ${GACHIMA_NAVER_VERIFY:}
    # 다음 웹마스터도구가 robots.txt 에 넣으라고 주는 한 줄 전체 (#DaumWebMasterTool:…)
    daum-verify: ${GACHIMA_DAUM_VERIFY:}
    # 이용안내에 보일 연락처 (이메일 등)
    contact: ${GACHIMA_CONTACT:}
  ui:
    # 당일 분석 화면에서 배당·마체중 입력칸과 스크린샷 올리기를 보일지 (기본: 숨김, 텔레그램으로 입력)
    web-input: ${GACHIMA_WEB_INPUT:false}
