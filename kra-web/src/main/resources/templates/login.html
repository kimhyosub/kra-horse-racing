<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>가치마 · 로그인</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/gachima.css}">
</head>
<body>
<div class="wrap login">
  <header class="brand"><div class="logo"><div><b>가치마</b><small>로그인</small></div></div></header>
  <div class="flash" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않습니다.</div>
  <div class="flash" th:if="${param.logout}">로그아웃했습니다.</div>
  <form class="input" method="post" th:action="@{/login}">
    <label class="field">아이디<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label class="field">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" name="remember-me" checked> 로그인 유지 (30일)</label>
    <div class="bar"><button class="btn" type="submit">로그인</button></div>
  </form>
</div>
</body>
</html>
