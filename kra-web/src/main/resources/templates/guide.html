<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <th:block th:replace="~{fragments :: seo(|${p.title} · 가치마 가이드|, ${desc})}"></th:block>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <!-- 휴대폰 홈 화면에 추가하면 앱처럼 (PWA) -->
  <link rel="manifest" th:href="@{/manifest.json}">
  <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="가치마">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fbefd2">
  <link rel="stylesheet" th:href="@{/css/gachima.css}">
</head>
<body>
<div class="wrap">
  <header th:replace="~{fragments :: topbar('가이드')}"></header>
  <div class="flash" th:if="${msg}" th:text="${msg}"></div>
  <article class="post">
    <p class="post-draft" th:unless="${p.published}">비공개 초안 (관리자에게만 보임)</p>
    <a class="post-cat" th:href="@{/guide(cat=${p.category})}" th:text="${p.categoryLabel}">분류</a>
    <h1 th:text="${p.title}">제목</h1>
    <p class="post-meta"><b class="post-by">가치마</b> · <span th:text="${#temporals.format(p.createdAt, 'yyyy.MM.dd')}"></span>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{|/admin/posts/${p.id}|}">· 고치기</a></p>
    <div class="post-body" th:utext="${html}"></div>
  </article>
  <nav class="post-more" th:unless="${#lists.isEmpty(others)}">
    <b th:text="|다른 ${p.categoryLabel}|">다른 가이드</b>
    <a th:each="o : ${others}" th:href="@{|/guide/${o.slug}|}" th:text="${o.title}"></a>
    <a class="pm-all" th:href="@{/guide}">가이드 전체 보기 →</a>
  </nav>
  <footer th:replace="~{fragments :: foot}"></footer>
  <nav th:replace="~{fragments :: tabbar('guide')}"></nav>
</div>
</body>
</html>
